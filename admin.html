<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <title>TOPGEO - Admin Contracheques</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="admin-panel">
            <div class="logo" style="margin-bottom: 20px;">
                <div class="logo-nome">TOPGEO</div>
                <div class="logo-sub">ENGENHARIA E SERVIÇOS LTDA</div>
            </div>
            
            <!-- TELA DE LOGIN DO ADMIN -->
            <div id="telaLoginAdmin">
                <h1>🔐 Painel Administrativo</h1>
                <input type="password" id="senhaAdmin" placeholder="Senha do administrador">
                <button onclick="loginAdmin()">Entrar</button>
                <p style="text-align:center; margin-top:15px; color:#999;">Senha: admin123</p>
            </div>
            
            <!-- PAINEL PRINCIPAL -->
            <div id="painelAdmin" style="display:none;">
                <div class="admin-header">
                    <h1>📊 Envio de Contracheques</h1>
                    <button onclick="logoutAdmin()" class="btn-sair">Sair</button>
                </div>
                
                <!-- ABAS -->
                <div class="abas">
                    <button class="aba-ativa" onclick="mostrarAba('enviar')">📤 Enviar</button>
                    <button onclick="mostrarAba('funcionarios')">👥 Funcionários</button>
                    <button onclick="mostrarAba('enviados')">📋 Enviados</button>
                    <button onclick="mostrarAba('relatorios')">📊 Relatórios</button>
                </div>
                
                <!-- ABA ENVIAR -->
                <div id="abaEnviar" class="aba-conteudo">
                    <div class="card">
                        <h2>📤 Enviar contracheque</h2>
                        <label>Funcionário:</label>
                        <select id="selFuncionario">
                            <option value="">-- Selecione --</option>
                        </select>
                        
                        <label>Mês/Ano:</label>
                        <input type="month" id="mesContracheque">
                        
                        <label>Link do PDF (Google Drive):</label>
                        <input type="text" id="linkPDF" placeholder="https://...">
                        
                        <button onclick="enviarContracheque()">📨 Enviar e Notificar</button>
                    </div>
                </div>
                
                <!-- ABA FUNCIONÁRIOS -->
                <div id="abaFuncionarios" class="aba-conteudo" style="display:none;">
                    <div class="card">
                        <h2>👥 Funcionários</h2>
                        <button onclick="abrirModalFuncionario()" style="background:#28a745;">+ Novo Funcionário</button>
                        <div id="listaFuncionarios" style="margin-top:20px;"></div>
                    </div>
                </div>
                
                <!-- ABA ENVIADOS -->
                <div id="abaEnviados" class="aba-conteudo" style="display:none;">
                    <div class="card">
                        <h2>📋 Contracheques Enviados</h2>
                        <div id="listaEnviados"></div>
                    </div>
                </div>
                
                <!-- ABA RELATÓRIOS -->
                <div id="abaRelatorios" class="aba-conteudo" style="display:none;">
                    <div class="card">
                        <h2>📊 Quem já visualizou?</h2>
                        <div id="relatorioVisualizacao"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- MODAL FUNCIONÁRIO -->
    <div id="modalFuncionario" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="background:white; max-width:400px; margin:100px auto; padding:30px; border-radius:15px;">
            <h2>➕ Novo Funcionário</h2>
            <label>Código:</label>
            <input type="text" id="novoCodigo" placeholder="Ex: FUNC001">
            <label>Nome:</label>
            <input type="text" id="novoNome" placeholder="Nome completo">
            <label>Email (para recuperar senha):</label>
            <input type="email" id="novoEmail" placeholder="email@empresa.com">
            <label>Senha:</label>
            <input type="text" id="novaSenha" placeholder="Senha" value="123456">
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button onclick="salvarFuncionario()">Salvar</button>
                <button onclick="fecharModal()" class="btn-voltar">Cancelar</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
